name: Release

# Thin caller: delegates to the shared macOS release pipeline
# (teddychan/dragon-release-ci). Build via tools/build-lm.sh + tools/build-app.sh
# (swiftc), Developer ID-sign, notarize, staple, publish Yahoo KeyKey 2, push the
# EdDSA-signed Sparkle appcast to docs/yahoo-keykey-2/, and bump the Homebrew
# cask. Triggered by a v* tag on this repo.
#
# Secrets are inherited from this repo's Actions secrets:
#   DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD,
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID,
#   PUBLIC_RELEASE_TOKEN, SPARKLE_EDDSA_PRIVATE_KEY
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# The reusable release workflow creates the GitHub Release and uploads assets,
# which needs contents: write. Declare it explicitly here so the release does not
# depend on this repo's default workflow-token setting being read/write.
permissions:
  contents: write

jobs:
  release:
    uses: teddychan/dragon-release-ci/.github/workflows/release-macos.yml@v6
    secrets: inherit
    with:
      # v6's tag gate replaces v5's `VERSION=${TAG##*v}`, which left a value containing no "v"
      # untouched — so a workflow_dispatch arrived with a BRANCH ref and produced VERSION=main.
      # It also accepts only exact `vX.Y.Z`, and requires whats_new_path: the two move together,
      # because passing whats_new_path to v5 fails at startup (v5 does not define the input) and
      # omitting it on v6 fails the gate.
      #
      # The config file FIRST — the version and section checks read that one — then every
      # translation. KeyKey's entries are abstract `L()` keys ("keykey.whatsNew.summary"), so the
      # text a user actually reads lives in these .strings and the .swift can sit still through a
      # complete rewrite of the notes. Watching only the .swift would reject that real rewrite and
      # wave through a release whose notes never changed. Needs dragon-release-ci >= v6.2.0, which
      # is what made the input accept a list.
      #
      # These are the real files, not the symlinks under Packages/KeyKeyApp/Sources/KeyKeyApp/ —
      # the gate stats each path and diffs it, so it must name what git tracks.
      whats_new_path: >-
        App/WhatsNewConfig.swift
        App/en.lproj/Localizable.strings
        App/zh-Hant.lproj/Localizable.strings
      build_kind: script
      # Yahoo KeyKey 2 now targets the macOS 26 SDK, so build on the macos-26 image.
      swiftpm_runner: macos-26
      app_slug: yahoo-keykey-2
      # Moving the appcast off the marketing site. Steps 1 and 2 are done; the mirror stays.
      #
      # MAC-APP-RELEASE-LIFECYCLE.md: "Sparkle appcasts are update infrastructure, not marketing
      # content. Each app should host its production appcast in its own repository so an outage,
      # permission problem, or rejected change in the marketing-site repository cannot interfere
      # with update delivery." This caller used to pass no appcast_repo at all and so took the default,
      # teddychan/www.dragonapp.com. KeyKey was the last of the five to migrate.
      #
      # The same spec says to migrate "by mirroring the old and new locations until installed
      # versions have moved to the app-owned URL", which is why this is two releases and not one.
      # Every KeyKey installed at the time read SUFeedURL from the site, so flipping the destination
      # alone would have left all of them silently unable to see updates. That is not hypothetical
      # here: the site is GitHub Pages, and an ice-2 mirror commit sat in a QUEUED Pages
      # deployment for minutes after the release finished while the app-owned copy was already
      # serving. A queue is survivable; a 404 is not.
      #
      #   step 1  v2.11.3  published to BOTH, with App/Info.plist still pointing at the site, so
      #                    nothing changed for anyone — but the app-owned feed came into existence
      #                    and was current. Both copies verified byte-identical after.
      #   step 2  v2.11.4  SUFeedURL moved to
      #                    https://raw.githubusercontent.com/teddychan/yahoo-keykey-2/main/docs/yahoo-keykey-2/appcast.xml
      #   later            drop appcast_mirror_repo when no supported version still reads the site.
      #
      # Do not drop the mirror early. Every copy still at 2.11.3 or older reads the site and only
      # the site; the mirror is the whole reason flipping SUFeedURL did not strand them.
      #
      # Needs dragon-release-ci >= v6.3.0. The appcast is generated once and copied to both, so
      # the two cannot disagree — including the minimumSystemVersion/hardwareRequirements that
      # appcast_inject_keykey_requirements adds below, which are injected before the copy.
      # Publishing here uses the built-in GITHUB_TOKEN (contents: write is granted above); the
      # mirror needs PUBLIC_RELEASE_TOKEN, which `secrets: inherit` already supplies — the same
      # token that publishes to the site today. A missing mirror token is a hard error.
      appcast_repo: teddychan/yahoo-keykey-2
      appcast_mirror_repo: teddychan/www.dragonapp.com
      release_title_prefix: Yahoo KeyKey 2
      bot_name: KeyKey Release Bot
      assert_tag_matches_plist: true
      script_entitlements_path: App/YahooKeyKey2.entitlements
      zip_name_template: 'YahooKeyKey2-{VERSION}.zip'
      zip_keep_parent: false
      stage_install_txt: true
      staged_app_name: YahooKeyKey2.app
      generate_appcast_glob: keykey-cache
      appcast_maximum_deltas_zero: true
      appcast_inject_keykey_requirements: true
